<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Deep Dark Orb Gradient -->
    <radialGradient id="bgOrb" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e1b4b" />   <!-- Deepest Indigo -->
      <stop offset="65%" stop-color="#0f172a" />   <!-- Dark Slate -->
      <stop offset="100%" stop-color="#020617" />  <!-- Near Black -->
    </radialGradient>

    <!-- Multi Blue-Purple Gradient for the Silhouette -->
    <linearGradient id="figGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" />    <!-- Bright Blue -->
      <stop offset="50%" stop-color="#8b5cf6" />   <!-- Vivid Purple -->
      <stop offset="100%" stop-color="#312e81" />  <!-- Dark Indigo -->
    </linearGradient>

    <!-- Highlight Gradient for Hair Texture/Volume -->
    <linearGradient id="hairGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Glowing effect -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background / Base Dark Orb -->
  <circle cx="256" cy="256" r="240" fill="url(#bgOrb)" />

  <!-- Outer Tech Ring -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="url(#figGrad)" stroke-width="2" opacity="0.3" filter="url(#neonGlow)"/>

  <!-- Body / Shoulders (Mapped to the photo's shirt slope) -->
  <path d="M 90 480 C 120 330, 180 290, 256 290 C 332 290, 392 330, 422 480 Z" fill="url(#figGrad)" opacity="0.85" filter="url(#neonGlow)"/>
  
  <!-- Abstract Collar Lines (Representing the collared shirt) -->
  <path d="M 180 480 L 256 330 L 332 480 M 256 330 L 256 480" fill="none" stroke="#60a5fa" stroke-width="4" opacity="0.4"/>

  <!-- Face / Jawline (Mapped to the photo's facial structure) -->
  <path d="M 185 160 C 180 240, 210 275, 256 285 C 302 275, 332 240, 327 160 Z" fill="url(#figGrad)" opacity="0.95"/>

  <!-- Hair Volume (Modeled after the textured, curly hair in the photo) -->
  <path d="M 175 160 C 160 110, 190 70, 240 60 C 280 50, 320 70, 340 110 C 355 145, 335 175, 325 185 C 290 160, 220 160, 175 160 Z" fill="url(#hairGrad)" filter="url(#neonGlow)"/>
  
  <!-- Overlapping geometric nodes to simulate the hair's curls and texture -->
  <circle cx="230" cy="80" r="35" fill="#a855f7" opacity="0.7" filter="url(#neonGlow)"/>
  <circle cx="285" cy="95" r="30" fill="#3b82f6" opacity="0.8" filter="url(#neonGlow)"/>
  <circle cx="195" cy="125" r="22" fill="#8b5cf6" opacity="0.6" />
  <circle cx="320" cy="135" r="24" fill="#60a5fa" opacity="0.6" />

  <!-- Inner Tech Nodes (Abstract representation of eyes) -->
  <circle cx="220" cy="205" r="6" fill="#ffffff" filter="url(#neonGlow)"/>
  <circle cx="292" cy="205" r="6" fill="#ffffff" filter="url(#neonGlow)"/>

  <!-- Abstract Beard/Chin Geometry -->
  <path d="M 225 265 L 256 285 L 287 265 L 256 250 Z" fill="#1e1b4b" opacity="0.6" />
</svg>
